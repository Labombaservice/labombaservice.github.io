<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>La Bomba Service</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      /* z-index:0 makes body a stacking context so the ::before image layer
         below paints above body's own dark background instead of behind it. */
      body {
        position: relative;
        z-index: 0;
        min-height: 100vh;
      }
      /* Full-screen background image, same as the landing page. */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #0b0d10 url("fond.png") no-repeat center center;
        background-size: cover;
        z-index: -1;
        pointer-events: none;
      }
      @media (max-width: 760px) {
        body::before {
          background-size: contain;
        }
      }

      /* running: a spinner on the floor of the image. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        bottom: 16px;
        left: 50%;
        width: 34px;
        height: 34px;
        margin-left: -21px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 90%;
        padding: 6px 16px;
        border-radius: 10px;
        background: rgba(12, 15, 20, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: #7fd0a0;
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
        background: rgba(11, 13, 16, 0.82);
        border-radius: 10px;
        margin: 12px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=19";
    </script>
  </body>
</html>
